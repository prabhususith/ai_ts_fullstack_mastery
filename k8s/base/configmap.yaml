apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-enterprise-config
  namespace: ai-enterprise
  labels:
    app.kubernetes.io/name: ai-enterprise-config
data:
  NODE_ENV: "production"
  PORT: "4000"
  FRONTEND_URL: "http://frontend.ai-enterprise.svc.cluster.local"
  LOG_LEVEL: "info"
  DB_HOST: "postgres.ai-enterprise.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "ai_enterprise_db"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "20"
  DB_SSL_ENABLED: "false"
  REDIS_HOST: "redis.ai-enterprise.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_TTL_SECONDS: "3600"
  SEMANTIC_CACHE_SIMILARITY_THRESHOLD: "0.92"
  RATE_LIMIT_MAX_REQUESTS: "100"
  RATE_LIMIT_WINDOW_MS: "60000"
  EMBEDDINGS_MODEL: "Xenova/all-MiniLM-L6-v2"
  EMBEDDINGS_DIMENSION: "384"
  MAX_CHUNK_TOKENS: "512"
  CHUNK_OVERLAP_TOKENS: "64"
  CLOUD_PROVIDER: "localhost"
