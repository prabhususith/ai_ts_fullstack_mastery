apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ai-enterprise
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
