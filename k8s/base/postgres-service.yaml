apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-enterprise
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: ai-enterprise
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
