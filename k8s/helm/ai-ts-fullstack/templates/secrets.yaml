apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-ts-fullstack.fullname" . }}-secrets
  labels:
    {{- include "ai-ts-fullstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "ai-ts-fullstack.fullname" . }}-postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.dbName }}"
  DB_USER: {{ .Values.postgres.user | quote }}
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
  REDIS_URL: "redis://{{ include "ai-ts-fullstack.fullname" . }}-redis:{{ .Values.redis.port }}"
  JWT_SECRET: "super-secret-jwt-key-with-minimum-32-characters-entropy-999"
  CANARY_TOKEN_SECRET: "canary-guard-entropy-777"
