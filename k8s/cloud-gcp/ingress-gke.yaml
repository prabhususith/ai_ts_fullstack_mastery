apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gke-managed-ingress
  namespace: ai-enterprise
  labels:
    app.kubernetes.io/name: gke-managed-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "ai-enterprise-cert"
    networking.gke.io/v1beta1.FrontendConfig: "ai-frontend-config"
spec:
  rules:
    - host: ai-enterprise.gcp.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80
