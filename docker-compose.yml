version: '3.8'

# ==============================================================================
# Production-like Orchestration Stack (Docker Compose)
# Services: Backend, Frontend, ankane/pgvector, Redis 7
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL with pgvector extension (ankane/pgvector:latest)
  # ----------------------------------------------------------------------------
  postgres:
    image: ankane/pgvector:latest
    container_name: ai_pgvector_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-ai_enterprise_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_enterprise_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai_net

  # ----------------------------------------------------------------------------
  # Redis 7 Alpine - Semantic Cache & Pub/Sub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai_redis_cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ai_net

  # ----------------------------------------------------------------------------
  # Node.js 20+ Express Backend (100% Strict TypeScript)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_backend_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@postgres:5432/${DB_NAME:-ai_enterprise_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-with-minimum-32-characters-entropy-999}
      FRONTEND_URL: http://localhost:80
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_net

  # ----------------------------------------------------------------------------
  # React 18+ Vite Frontend (Nginx Alpine SPA Server)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai_frontend_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - ai_net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  ai_net:
    driver: bridge
