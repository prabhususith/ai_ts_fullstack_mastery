apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-enterprise

resources:
  - ../base
  - ingress-local.yaml

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
