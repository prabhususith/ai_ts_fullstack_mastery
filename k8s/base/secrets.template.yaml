apiVersion: v1
kind: Secret
metadata:
  name: ai-enterprise-secrets
  namespace: ai-enterprise
  labels:
    app.kubernetes.io/name: ai-enterprise-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:postgrespassword@postgres.ai-enterprise.svc.cluster.local:5432/ai_enterprise_db"
  DB_USER: "postgres"
  DB_PASSWORD: "postgrespassword"
